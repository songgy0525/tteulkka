spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tteulkka
    username: tteulkka
    password: tteulkka
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

public-data:
  api-key: ${PUBLIC_DATA_API_KEY}
  store-api-base-url: https://apis.data.go.kr/B553077/api/open/sdsc2

